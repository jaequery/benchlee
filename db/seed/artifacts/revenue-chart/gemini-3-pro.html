<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue Growth 2024–2025</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e1117;
    color: #e8eaed;
    font-family: "Google Sans", system-ui, -apple-system, sans-serif;
    padding: 44px 28px;
    display: flex;
    justify-content: center;
  }
  .panel {
    width: 100%;
    max-width: 1180px;
    background: #161a22;
    border: 1px solid #262c38;
    border-radius: 16px;
    padding: 30px 34px 22px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .caption { color: #9aa0a6; font-size: 13.5px; margin-top: 5px; }
  .delta { text-align: right; }
  .delta b { font-size: 26px; color: #34d399; font-weight: 600; }
  .delta span { display: block; font-size: 12px; color: #9aa0a6; letter-spacing: .06em; text-transform: uppercase; }
  .keys { display: flex; gap: 20px; margin-top: 18px; font-size: 13px; color: #b6bcc5; }
  .keys i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
  svg { width: 100%; height: auto; display: block; margin-top: 10px; }
  .gl { stroke: #232a35; stroke-width: 1; stroke-dasharray: 3 4; }
  .axl { stroke: #3c4452; stroke-width: 1.2; }
  .tk { fill: #8b93a1; font-size: 12.5px; }
  .ql { fill: #c3c9d2; font-size: 12.5px; text-anchor: middle; }
  .yl { fill: #7a8290; font-size: 11.5px; text-anchor: middle; letter-spacing: .14em; }
  .val { fill: #e8eaed; font-size: 12px; font-weight: 600; text-anchor: middle; }
  .unit { fill: #8b93a1; font-size: 12px; }
</style>
</head>
<body>
<div class="panel">
  <header>
    <div>
      <h1>Revenue growth, 2024–2025</h1>
      <p class="caption">Recognised revenue per quarter, in millions of US dollars.</p>
    </div>
    <div class="delta">
      <b>+467%</b>
      <span>Q1 2024 → Q4 2025</span>
    </div>
  </header>

  <div class="keys">
    <span><i style="background:#4285f4"></i>Quarterly revenue</span>
    <span><i style="background:#fbbc04"></i>Trend</span>
  </div>

  <svg viewBox="0 0 1180 570" role="img" aria-label="Quarterly revenue bars with trend line, 2024 to 2025">
    <defs>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4285f4" flood-opacity="0.35"/>
      </filter>
    </defs>

    <line class="gl" x1="84" y1="490" x2="1140" y2="490"/>
    <line class="gl" x1="84" y1="429" x2="1140" y2="429"/>
    <line class="gl" x1="84" y1="368" x2="1140" y2="368"/>
    <line class="gl" x1="84" y1="307" x2="1140" y2="307"/>
    <line class="gl" x1="84" y1="246" x2="1140" y2="246"/>
    <line class="gl" x1="84" y1="185" x2="1140" y2="185"/>
    <line class="gl" x1="84" y1="124" x2="1140" y2="124"/>
    <line class="gl" x1="84" y1="63"  x2="1140" y2="63"/>

    <text class="tk" x="70" y="494" text-anchor="end">0</text>
    <text class="tk" x="70" y="433" text-anchor="end">1</text>
    <text class="tk" x="70" y="372" text-anchor="end">2</text>
    <text class="tk" x="70" y="311" text-anchor="end">3</text>
    <text class="tk" x="70" y="250" text-anchor="end">4</text>
    <text class="tk" x="70" y="189" text-anchor="end">5</text>
    <text class="tk" x="70" y="128" text-anchor="end">6</text>
    <text class="tk" x="70" y="67"  text-anchor="end">7</text>
    <text class="unit" x="84" y="36">US$ millions</text>

    <!-- 61px per 1.0M, baseline 490 -->
    <g filter="url(#soft)" fill="#4285f4">
      <rect x="112"  y="416.8" width="72" height="73.2" rx="4"/>
      <rect x="244"  y="374.1" width="72" height="115.9" rx="4"/>
      <rect x="376"  y="343.6" width="72" height="146.4" rx="4"/>
      <rect x="508"  y="300.9" width="72" height="189.1" rx="4"/>
      <rect x="640"  y="307.0" width="72" height="183.0" rx="4"/>
      <rect x="772"  y="221.6" width="72" height="268.4" rx="4"/>
      <rect x="904"  y="179.9" width="72" height="310.1" rx="4"/>
      <rect x="1036" y="76.2"  width="72" height="413.8" rx="4"/>
    </g>

    <text class="val" x="148"  y="408">1.2</text>
    <text class="val" x="280"  y="365">1.9</text>
    <text class="val" x="412"  y="335">2.4</text>
    <text class="val" x="544"  y="292">3.1</text>
    <text class="val" x="676"  y="298">3.0</text>
    <text class="val" x="808"  y="213">4.4</text>
    <text class="val" x="940"  y="171">5.1</text>
    <text class="val" x="1072" y="67">6.8</text>

    <polyline fill="none" stroke="#fbbc04" stroke-width="2.5" stroke-linejoin="round"
      points="148,416.8 280,374.1 412,343.6 544,300.9 676,307.0 808,221.6 940,179.9 1072,76.2"/>

    <line class="axl" x1="84" y1="63" x2="84" y2="490"/>
    <line class="axl" x1="84" y1="490" x2="1140" y2="490"/>

    <text class="ql" x="148"  y="514">Q1</text>
    <text class="ql" x="280"  y="514">Q2</text>
    <text class="ql" x="412"  y="514">Q3</text>
    <text class="ql" x="544"  y="514">Q4</text>
    <text class="ql" x="676"  y="514">Q1</text>
    <text class="ql" x="808"  y="514">Q2</text>
    <text class="ql" x="940"  y="514">Q3</text>
    <text class="ql" x="1072" y="514">Q4</text>

    <text class="yl" x="346" y="542">2024</text>
    <text class="yl" x="874" y="542">2025</text>
  </svg>
</div>
</body>
</html>
