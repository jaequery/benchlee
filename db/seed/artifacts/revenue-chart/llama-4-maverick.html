<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quarterly Revenue Chart</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #000000;
  padding: 30px;
}
h2 { text-align: center; }
svg { display: block; margin: 0 auto; border: 1px solid #cccccc; }
</style>
</head>
<body>

<h2>Quarterly Revenue 2024-2025</h2>

<svg width="900" height="500" viewBox="0 0 900 500">

  <!-- y axis -->
  <line x1="80" y1="40" x2="80" y2="420" stroke="black" stroke-width="2"/>

  <line x1="80" y1="420" x2="860" y2="420" stroke="black" stroke-width="2"/>

  <text x="20" y="45" font-size="12">7.0</text>
  <text x="20" y="140" font-size="12">5.0</text>

  <text x="20" y="330" font-size="12">1.0</text>
  <text x="20" y="425" font-size="12">0.0</text>

  <rect x="195" y="340" width="70" height="80" fill="#4472c4"/>
  <rect x="290" y="300" width="70" height="120" fill="#4472c4"/>
  <rect x="385" y="260" width="70" height="160" fill="#4472c4"/>
  <rect x="480" y="220" width="70" height="200" fill="#4472c4"/>
  <rect x="575" y="180" width="70" height="240" fill="#4472c4"/>
  <rect x="670" y="140" width="70" height="280" fill="#4472c4"/>
  <rect x="765" y="100" width="70" height="320" fill="#4472c4"/>

  <!-- trend line -->
  <line x1="135" y1="380" x2="800" y2="100" stroke="#ed7d31" stroke-width="3"/>

  <!-- labels -->
  <text x="135" y="440" font-size="11" text-anchor="middle">2024Q1</text>
  <text x="230" y="440" font-size="11" text-anchor="middle">2024Q2</text>
  <text x="325" y="440" font-size="11" text-anchor="middle">2024Q3</text>
  <text x="420" y="440" font-size="11" text-anchor="middle">2024Q4</text>
  <text x="515" y="440" font-size="11" text-anchor="middle">2025Q1</text>
  <text x="610" y="440" font-size="11" text-anchor="middle">2025Q2</text>
  <text x="705" y="440" font-size="11" text-anchor="middle">2025Q3</text>
  <text x="800" y="440" font-size="11" text-anchor="middle">2025Q4</text>

  <text x="135" y="375" font-size="10" text-anchor="middle">1.2</text>
  <text x="230" y="335" font-size="10" text-anchor="middle">1.9</text>
  <text x="325" y="295" font-size="10" text-anchor="middle">2.4</text>
  <text x="420" y="255" font-size="10" text-anchor="middle">3.1</text>
  <text x="515" y="215" font-size="10" text-anchor="middle">3.0</text>
  <text x="610" y="175" font-size="10" text-anchor="middle">4.4</text>
  <text x="705" y="135" font-size="10" text-anchor="middle">5.1</text>
  <text x="800" y="95" font-size="10" text-anchor="middle">6.8</text>

</svg>

</body>
</html>
