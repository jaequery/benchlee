<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 - Page Not Found</title>
<style>
body {
  background-color: #1e1e1e;
  color: #ffffff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  text-align: center;
}

h1 {
  font-size: 96px;
  margin: 0;
}

h2 {
  font-size: 24px;
  font-weight: normal;
  margin: 10px 0;
}

p {
  color: #aaaaaa;
  margin-bottom: 30px;
}

a {
  background-color: #007bff;
  color: #ffffff;
  padding: 12px 24px;
  text-decoration: none;
  border-radius: 4px;
}

a:hover {
  background-color: #0056b3;
}
</style>
</head>
<body>

<h1>404</h1>
<h2>Page Not Found</h2>
<p>Sorry, the page you are looking for does not exist.</p>
<a href="/">Go to Homepage</a>

</body>
</html>
