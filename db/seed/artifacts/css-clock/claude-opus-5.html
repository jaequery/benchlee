<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Clock</title>
<style>
  /* No JavaScript anywhere in this file. The hands are driven entirely by
     CSS animations whose durations ARE the real periods:
       second hand  60s
       minute hand  3600s   (60 x 60)
       hour hand    43200s  (12 x 3600)
     A negative animation-delay starts the clock at 10:10:30 rather than at 12:00,
     which is both the traditional watch-photo pose and proof the delays are real. */
  :root {
    --face: 340px;
    --ink: #17181b;
    --dial: #f6f5f1;
    --rim: #d9d7ce;
    --accent: #c8352b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 26px;
    background: #22242a;
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color: #9a9ea8;
    padding: 40px 20px;
  }

  .clock {
    position: relative;
    width: var(--face);
    height: var(--face);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, var(--dial) 62%, #eae8e1 100%);
    border: 10px solid var(--rim);
    box-shadow:
      0 0 0 1px #b9b7ae,
      0 30px 60px -24px rgba(0, 0, 0, .7),
      inset 0 2px 6px rgba(255, 255, 255, .9);
  }

  /* Twelve hour markers, each rotated into place around the dial. */
  .mark {
    position: absolute;
    inset: 0;
  }
  .mark::before {
    content: "";
    position: absolute;
    top: 14px;
    left: 50%;
    width: 2px;
    height: 14px;
    margin-left: -1px;
    background: #8d8b83;
    border-radius: 1px;
  }
  /* the four cardinal markers are heavier */
  .mark.major::before {
    width: 4px;
    height: 20px;
    margin-left: -2px;
    background: var(--ink);
  }
  .m1  { transform: rotate(30deg); }
  .m2  { transform: rotate(60deg); }
  .m3  { transform: rotate(90deg); }
  .m4  { transform: rotate(120deg); }
  .m5  { transform: rotate(150deg); }
  .m6  { transform: rotate(180deg); }
  .m7  { transform: rotate(210deg); }
  .m8  { transform: rotate(240deg); }
  .m9  { transform: rotate(270deg); }
  .m10 { transform: rotate(300deg); }
  .m11 { transform: rotate(330deg); }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 999px;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-name: sweep;
  }
  @keyframes sweep {
    from { transform: translateX(-50%) rotate(0deg); }
    to   { transform: translateX(-50%) rotate(360deg); }
  }

  .hour {
    width: 9px;
    height: 88px;
    background: var(--ink);
    animation-duration: 43200s;      /* 12 hours */
    animation-delay: -36630s;        /* 10:10:30 */
    z-index: 3;
  }
  .minute {
    width: 6px;
    height: 128px;
    background: #2e3038;
    animation-duration: 3600s;       /* 1 hour */
    animation-delay: -630s;
    z-index: 4;
  }
  .second {
    width: 2px;
    height: 142px;
    background: var(--accent);
    animation-duration: 60s;         /* 1 minute */
    animation-delay: -30s;
    z-index: 5;
  }
  /* counterweight tail on the second hand */
  .second::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -26px;
    width: 2px;
    height: 26px;
    margin-left: -1px;
    background: var(--accent);
  }

  .pin {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--dial);
    z-index: 6;
  }

  .brandmark {
    position: absolute;
    top: 34%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #a3a099;
  }

  footer { font-size: 13px; letter-spacing: .02em; }
  footer code { color: #cdd2db; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
  <div class="clock">
    <div class="brandmark">Automatic</div>

    <div class="mark major m0"></div>
    <div class="mark m1"></div>
    <div class="mark m2"></div>
    <div class="mark major m3"></div>
    <div class="mark m4"></div>
    <div class="mark m5"></div>
    <div class="mark major m6"></div>
    <div class="mark m7"></div>
    <div class="mark m8"></div>
    <div class="mark major m9"></div>
    <div class="mark m10"></div>
    <div class="mark m11"></div>

    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="pin"></div>
  </div>

  <footer>
    <code>60s</code> · <code>3600s</code> · <code>43200s</code> — zero JavaScript
  </footer>
</body>
</html>
